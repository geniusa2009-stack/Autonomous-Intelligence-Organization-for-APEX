[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "apex-one"
version = "0.1.0"
description = "APEX ONE ULTRA — Autonomous Research, Editorial, Design & Quality Intelligence Organization"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "Proprietary - APEX" }
dependencies = [
  "pydantic>=2.7",
  "pyyaml>=6",
  "fastapi>=0.110",
  "uvicorn>=0.29",
  "typer>=0.12",
  "rich>=13",
  "httpx>=0.27",
  "sqlalchemy>=2.0",
  "alembic>=1.13",
  "jinja2>=3.1",
  "beautifulsoup4>=4.12",
  "lxml>=5",
  "pymupdf>=1.24",
  "pillow>=10",
  "numpy>=1.26",
  "playwright>=1.44",
]

[project.optional-dependencies]
pdf-fallback = ["weasyprint>=62"]
postgres = ["psycopg[binary]>=3.1", "pgvector>=0.2"]
docling = ["docling>=2"]
browser-agent = ["browser-use"]
dev = ["pytest>=8", "pytest-asyncio>=0.23"]

[project.scripts]
apex-one = "apex_one.apps.cli.main:app"

[tool.setuptools.packages.find]
include = ["apex_one*"]

[tool.setuptools.package-data]
apex_one = ["assets/**/*", "document/compiler/templates/**/*", "apps/studio/static/**/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
  "live: requires real network/credentials (disabled by default; enable with APEX_LIVE_TESTS=1)",
  "browser: requires Chromium via Playwright",
]
addopts = "-q"
