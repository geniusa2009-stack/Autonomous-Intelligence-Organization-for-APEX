# Phase 16 — design arsenal activation record (evidence-based; 2026-10-10).
#
# Evidence quality levels:
#   primary   = read from the artifact/model card itself in this environment
#   secondary = web-search summary of the model card / paper (not the licence text itself)
#   none      = nothing found
# Environment facts that apply to every row:
#   * huggingface.co, github.com releases, arxiv.org: DENIED by the egress policy (CONNECT 403) -> weights unreachable
#   * hardware: 4 vCPU x86, 15.7 GB RAM, no GPU -> 7B+ VLMs only as quantised GGUF on CPU (none published for these)
#   * PyPI and the Docker Hub `ai/` catalogue ARE reachable.
#
# Activation statuses:
#   ACTIVATED               ran for real here (smoke test artifacts stored)
#   PROTOCOL_REIMPLEMENTED  the published method/protocol runs here on other (local, real) models — NOT the original weights
#   PACKAGE_INSTALLABLE     official package reachable; awaiting a data/weight dependency
#   WEIGHTS_UNREACHABLE     checkpoint exists but its host is denied by egress policy
#   HARDWARE_BLOCKED        would not fit/run usefully on this machine even with weights
#   ARCHITECTURE_REFERENCE  used as design inspiration only (method folded into native engines)
#   NOT_RELEASED_OR_UNFOUND no public checkpoint/code could be confirmed
#
# final_state (ONE honest state per system; precedence DEPENDENCY_MISSING > LICENSE_BLOCKED > HARDWARE_BLOCKED >
# NETWORK_BLOCKED; secondary blockers in final_note): LIVE_TESTED | ADAPTER_TESTED_ONLY | HARDWARE_BLOCKED |
# NETWORK_BLOCKED | LICENSE_BLOCKED | RESEARCH_ONLY | DEPENDENCY_MISSING | NO_FREE_ROUTE | NOT_IMPLEMENTED.
# "Registered" is never a state: a registry entry without a run is at best ADAPTER_TESTED_ONLY.
