# Approved section templates. Several variants per section; the writer rotates them by seed and avoids
# reusing a variant already used in recent guides (VoiceMemory).
schema_version: 1
opening:
  - kicker: "الحكاية باختصار"
    body:
      - "{institution} مش مجرد كلية ببلاش. دي كلية فكرتها كلها إن الطالب اللي عنده طموح ومعندوش فلوس يلاقي له مكان."
      - "الـ [[tuition]] متغطية بالكامل، بس ده مش معناه إن مفيش ولا مليم هتدفعه. هنفهم ده سوا بالأرقام."
      - "الدليل ده معمول عشان تاخد قرار صح، مش عشان تتحمس وخلاص."
  - kicker: "قبل ما تبدأ"
    body:
      - "فيه فرص بتبان حلوة من بره، و{institution} من الفرص اللي حلوة من جوه كمان، بس ليها شروط لازم تفهمها كويس."
      - "هنمشي معاك خطوة خطوة: مين يقدّم، هيدفع كام، وإمتى آخر ميعاد."
      - "كل رقم في الدليل ده متراجع من المصدر الرسمي، وكل رأي مكتوب عليه إنه رأي APEX."
snapshot:
  - kicker: "الصورة كاملة في صفحة"
    lead: "لو معاك دقيقة واحدة بس، دي أهم حاجات لازم تعرفها:"
hero_coverage:
  - kicker: "الرقم اللي بيفرق"
    line: "{{scholarship_coverage.tuition}} من الـ [[tuition]] متغطية لكل طالب بيتقبل."
    sub: "يعني مصاريف الدراسة نفسها مش هتكون العائق."
funding:
  - kicker: "الفلوس بالتفصيل"
    intro: "خلّينا نفصل بين اللي متغطي واللي عليك إنت، عشان مفيش مفاجآت بعدين."
    covered_label: "متغطي"
    you_pay_label: "عليك إنت"
eligibility:
  - kicker: "مين يقدر يقدّم؟"
    intro: "دي الشروط زي ما هي مكتوبة في المصدر الرسمي. اقراها كويس وقارنها بوضعك."
journey:
  - kicker: "رحلة التقديم"
    intro: "دي الحاجات اللي لازم تجهزها. ابدأ بالأصعب الأول، وغالباً هو امتحان الإنجليزي."
timeline:
  - kicker: "المواعيد"
    intro: "التواريخ دي مش بتتأجل عشان حد. حطها في الـ [[calendar]] دلوقتي."
apex_take:
  - kicker: "رأي APEX"
    fit_intro: "الفرصة دي مناسبة لك أوي لو:"
    poor_fit_intro: "وممكن متكونش مناسبة لو:"
checklist:
  - kicker: "اعمل إيه دلوقتي؟"
    intro: "خطة عملية مرتبة بالمواعيد:"
closing:
  - kicker: "الخلاصة"
    line: "الفرصة حقيقية، والشروط واضحة، والميعاد قريب. القرار دلوقتي في إيدك."
breath:
  - quote: "المنحة الكاملة مش بتدوّر على الطالب الكامل، بتدوّر على الطالب الواضح."
  - quote: "اقرا الشروط مرتين، وقدّم مرة واحدة صح."
